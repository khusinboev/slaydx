<style>
/* Layout: fixed left nav (desktop) + scrolling content; drawer nav below 860px. Tokens mirror app/globals.css of SlaydX. */
:root {
  --bg: #faf5ee; --fg: #2b2013; --card: #fffdf9; --muted: #f3e9d8; --muted-fg: #6b5540;
  --border: #ecdfc9; --input: #ecdfc9; --ring: #d9b78a; --side: #f3ead9;
  --primary: #f59e0b; --primary-fg: #1c1406;

  --warn: #a16207; --warn-bg: #fdf3d8; --info: #1d4ed8; --info-bg: #e8eefc;
  --c1: #d97706; --c2: #0f766e; --c3: #b91c1c; --c4: #6d28d9; --c5: #64748b;
  --shadow: 0 10px 30px rgba(43,32,19,.14);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121014; --fg: #f3ece2; --card: #1c1a17; --muted: #232019; --muted-fg: #a89a86;
  --border: #2e2820; --input: #3a3126; --ring: #8a7355; --side: #0c0b0d;
  --danger: #f87171; --danger-bg: #3a1716; --ok: #4ade80; --ok-bg: #12301d;
  --warn: #fbbf24; --warn-bg: #352a10; --info: #93b4ff; --info-bg: #17213d;
  --c1: #f59e0b; --c2: #2dd4bf; --c3: #f87171; --c4: #a78bfa; --c5: #94a3b8;
  --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121014; --fg: #f3ece2; --card: #1c1a17; --muted: #232019; --muted-fg: #a89a86;
  --border: #2e2820; --input: #3a3126; --ring: #8a7355; --side: #0c0b0d;
  --danger: #f87171; --danger-bg: #3a1716; --ok: #4ade80; --ok-bg: #12301d;
  --warn: #fbbf24; --warn-bg: #352a10; --info: #93b4ff; --info-bg: #17213d;
  --c1: #f59e0b; --c2: #2dd4bf; --c3: #f87171; --c4: #a78bfa; --c5: #94a3b8;
  --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.num, td.num, .tab { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted-fg); font-weight: 600; }
.muted { color: var(--muted-fg); }

/* App frame */
.app { display: grid; grid-template-columns: 236px 1fr; height: 100%; }
.side { background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 12px; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand b { font-size: 15px; } .brand small { display: block; color: var(--muted-fg); font-size: 11px; }
.nav { overflow-y: auto; padding: 4px 10px 16px; display: flex; flex-direction: column; gap: 1px; }
.nav .grp { padding: 14px 8px 4px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; color: var(--fg); }
.nav button:hover { background: var(--card); }
.nav button.on { background: var(--card); box-shadow: inset 3px 0 0 var(--primary); font-weight: 600; }
.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.nav .badge { margin-left: auto; }
.side-foot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--border); font-size: 12px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 24px; border-bottom: 1px solid var(--border); background: var(--bg); flex-wrap: wrap; }
.top .menu { display: none; }
.demo { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.top .spacer { flex: 1; }
.rolepick { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.content { overflow-y: auto; flex: 1; min-height: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head .grow { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
.crumb { font-size: 12px; color: var(--muted-fg); }
.crumb button { border: 0; background: none; padding: 0; color: var(--muted-fg); text-decoration: underline; text-underline-offset: 2px; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: var(--card); white-space: nowrap; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--ring); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); font-weight: 600; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--input)); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: none; }
.input, select.input, textarea.input { height: 34px; border: 1px solid var(--input); background: var(--card); border-radius: 8px; padding: 0 10px; min-width: 0; }
textarea.input { height: auto; padding: 8px 10px; resize: vertical; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--input); border-radius: 8px; overflow: hidden; background: var(--card); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 11px; font-size: 12.5px; }
.seg button.on { background: var(--primary); color: var(--primary-fg); font-weight: 600; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 12px; border-bottom: 2px solid transparent; white-space: nowrap; color: var(--muted-fg); font-weight: 500; }
.tabs button.on { border-color: var(--primary); color: var(--fg); font-weight: 600; }

/* Surfaces */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
.card > .ch { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card > .ch .grow { flex: 1; }
.card > .cb { padding: 14px 16px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(5, minmax(0,1fr)); }
.kpi { padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.kpi .v { font-size: 21px; font-weight: 650; letter-spacing: -.01em; }
.kpi .d { font-size: 12px; font-weight: 600; }
.up { color: var(--ok); } .down { color: var(--danger); }
.live { display: flex; gap: 22px; flex-wrap: wrap; padding: 10px 16px; align-items: center; }
.live .it { display: flex; gap: 8px; align-items: baseline; }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ok); display: inline-block; box-shadow: 0 0 0 3px var(--ok-bg); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-bg); }

/* Tables */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted-fg); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--card); position: sticky; top: 0; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: color-mix(in srgb, var(--muted) 55%, transparent); }
td.num, th.num { text-align: right; }
.pager { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--muted-fg); flex-wrap: wrap; }
.pager .grow { flex: 1; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--muted); color: var(--muted-fg); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--danger-bg); color: var(--danger); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.pri { background: color-mix(in srgb, var(--primary) 22%, transparent); color: var(--fg); }

/* Key/value */
.kv { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 7px 14px; font-size: 13px; }
.kv dt { color: var(--muted-fg); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.wallets { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.wallet { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
.wallet .v { font-size: 18px; font-weight: 650; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline .t { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; padding: 7px 0; font-size: 13px; align-items: start; }
.timeline .t i { width: 10px; height: 10px; border-radius: 99px; background: var(--primary); margin-top: 5px; }
.timeline .t i.bad { background: var(--danger); } .timeline .t i.ok { background: var(--ok); } .timeline .t i.m { background: var(--c5); }
.note { padding: 10px 12px; border-radius: 8px; background: var(--info-bg); color: var(--info); font-size: 12.5px; }
.note.warn { background: var(--warn-bg); color: var(--warn); }
.note.bad { background: var(--danger-bg); color: var(--danger); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted-fg); }
.json { font-family: var(--mono); font-size: 12px; background: var(--muted); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
.diff { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.bar { height: 6px; border-radius: 99px; background: var(--muted); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--primary); }
.forbid { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 60px 16px; text-align: center; }
.forbid .code { font-size: 40px; font-weight: 700; color: var(--muted-fg); }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted-fg); font-size: 10.5px; font-family: var(--sans); }
.chart .grid line { stroke: var(--border); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted-fg); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Pricing */
[hidden] { display: none !important; }
.nw { white-space: nowrap; }
.spark { display: inline-block; vertical-align: middle; }
input[type=range].range { accent-color: var(--primary); }

/* Matrix */
.matrix td, .matrix th { text-align: center; padding: 6px 8px; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.yes { color: var(--ok); font-weight: 700; } .step { font-size: 10px; color: var(--warn); font-weight: 700; margin-left: 2px; }

/* Overlay */
.scrim { position: fixed; inset: 0; background: rgba(20,14,6,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; display: flex; flex-direction: column; }
.dialog .dh { padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 4px; }
.dialog .db { padding: 10px 18px; display: flex; flex-direction: column; gap: 12px; }
.dialog .df { padding: 12px 18px 16px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
.field > span { font-weight: 600; }
.field .hint { color: var(--muted-fg); font-weight: 400; font-size: 12px; }
.err { color: var(--danger); font-size: 12px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check input { margin-top: 3px; }
.ba { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 10px 12px; background: var(--muted); border-radius: 8px; flex-wrap: wrap; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--card); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 40; display: flex; flex-direction: column; }
.drawer .dh { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.drawer .db { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13px; max-width: 360px; }
.otp { font-family: var(--mono); font-size: 26px; letter-spacing: .4em; text-align: center; height: 52px; }

/* Login */
.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.login .card { width: min(400px, 100%); padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }

@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 45; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: var(--shadow); }
  .top .menu { display: inline-flex; }
  .top { padding: 10px 16px; }
  .page { padding: 16px 16px 50px; }
  .g2, .g3, .diff { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .wallets { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function lineChart(data, key, { color = "var(--c1)", fmtY = fmt, h: H = 200 } = {}) {
  const W = 640, L = 52, R = 14, T = 12, B = 26, max = niceMax(Math.max(...data.map((d) => d[key])) * 1.08);
  const x = (i) => L + (i * (W - L - R)) / (data.length - 1), y = (v) => T + (H - T - B) * (1 - v / max);
  const pts = data.map((d, i) => `${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(" ");
  const ticks = [0, .25, .5, .75, 1].map((t) => max * t);
  const last = data[data.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kunlik grafik">
    <g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
    ${ticks.map((t) => `<text x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${fmtY(t)}</text>`).join("")}
    ${data.map((d, i) => (i % 5 === 0 || i === data.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${day(d.d)}</text>` : "")).join("")}
    <polygon points="${L},${y(0)} ${pts} ${x(data.length - 1)},${y(0)}" fill="${color}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(data.length - 1)}" cy="${y(last[key])}" r="4" fill="${color}" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}

  const bw = (W - L - R) / data.length, y = (v) => T + (H - T - B) * (1 - v / max);
  const ticks = [0, .5, 1].map((t) => max * t);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kunlik generatsiyalar">
    <g class="grid">${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
    ${ticks.map((t) => `<text x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`).join("")}
    ${data.map((d, i) => { const x0 = L + i * bw + 2, w = bw - 4; return `<rect x="${x0}" y="${y(d.completed)}" width="${w}" height="${y(0) - y(d.completed)}" rx="2" fill="var(--c2)"/><rect x="${x0}" y="${y(d.completed + d.failed)}" width="${w}" height="${y(0) - y(d.failed)}" rx="2" fill="var(--c3)"/>`; }).join("")}
    ${data.map((d, i) => (i % 5 === 0 || i === data.length - 1 ? `<text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${day(d.d)}</text>` : "")).join("")}
  </svg>`;
}

  pricing() {
    const rows = pricingRows(), fx = fxRate(), tm = PRICING_CFG.targetMarkup;

    const avgM = ((tot.rev - tot.cost) / tot.rev) * 100;
    const low = rows.filter((r) => r.c.margin < 30), lowCov = rows.filter((r) => r.p.cover < 90);

      ["O'rtacha marja", avgM.toFixed(1) + "%", "tushum bo'yicha tortilgan", marginTone(avgM) === "bad" ? "down" : marginTone(avgM) === "ok" ? "up" : "muted"],

      ["AI xarajat · 30 kun (so'm)", fmt(Math.round(tot.cost)), usd(tot.cost / fx) + " · xato xarajati bilan", "muted"],

      ["Maqsadli ustama", tm.toFixed(1) + "×", "pricing.target_markup", "muted"],

      <div class="legend"><span><i style="background:var(--danger)"></i>&lt; 30%</span><span><i style="background:var(--warn)"></i>30–60%</span><span><i style="background:var(--ok)"></i>&gt; 60%</span></div>
      <label class="rolepick"><span class="muted">Saralash:</span><select class="input" id="psort" aria-label="Saralash">${[["margin", "Marja (past avval)"], ["cost", "Tannarx (yuqori avval)"], ["volume", "Hajm (ko'p avval)"]].map(([v, l]) => `<option value="${v}" ${sortBy === v ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
      <div class="tw"><table><thead><tr><th>Vosita</th><th class="num">Asosiy narx</th><th>Tuzatish</th><th class="num">Amaldagi narx</th><th class="num">O'rtacha tannarx</th><th class="num">Ustama ×</th><th>Marja %</th><th class="num">Ishlar (30 kun)</th><th>Trend (30 kun)</th><th>Tavsiya</th></tr></thead><tbody>
      ${rows.map(({ p, c }) => { const t = tr30(p); return `<tr class="click" data-price="${h(p.id)}">

        <td class="num nw">${rangeTxt(p.ladder.map((l) => l.base))}</td>
        <td>${p.pct === 100 ? '<span class="pill">100%</span>' : `<span class="pill pri">${p.pct > 100 ? "▲" : "▼"} ${p.pct}%</span>`}</td>
        <td class="num nw">${rangeTxt(c.eff)}</td>

/* ───────── pricing helpers ───────── */
const marginTone = (m) => (m < 30 ? "bad" : m <= 60 ? "warn" : "ok");
function spark(data, w = 84, hh = 26) {
  const v = data.map((d) => d.usd), mn = Math.min(...v), mx = Math.max(...v), rg = mx - mn || 1;
  const x = (i) => 2 + (i * (w - 4)) / (v.length - 1), y = (a) => hh - 3 - ((a - mn) / rg) * (hh - 6);
  const col = v[v.length - 1] > v[0] * 1.05 ? "var(--danger)" : v[v.length - 1] < v[0] * 0.95 ? "var(--ok)" : "var(--muted-fg)";
  return `<svg class="spark" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" role="img" aria-label="30 kunlik tannarx trendi"><polyline points="${v.map((a, i) => `${x(i).toFixed(1)},${y(a).toFixed(1)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(v.length - 1).toFixed(1)}" cy="${y(v[v.length - 1]).toFixed(1)}" r="2.2" fill="${col}"/></svg>`;
}
function recChip(p, c) {
  const rec = recPercent(p, c), diff = rec - p.pct, low = doneJobs(p) < 20;
  const tip = `Tavsiya: ${rec}% (ustama ${c.markup.toFixed(1)}× → ${PRICING_CFG.targetMarkup.toFixed(1)}×) · tanlama: ${doneJobs(p)} ta tayyor ish`;
  const chip = Math.abs(diff) <= 5 ? '<span class="pill ok">Mos</span>' : diff > 0 ? `<span class="pill ${c.margin < 30 ? "bad" : "warn"}">+${diff}% tavsiya</span>` : `<span class="pill info">−${-diff}% tavsiya</span>`;
  return `<span title="${h(tip)}">${chip}${low ? ' <span class="pill">kam ishonch</span>' : ""}</span>`;
}
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
function ladderCompare(p, pct, rt) {
  const cur = priceCalc(p), nw = priceCalc(p, pct, rt);
  return `<table><thead><tr><th>Daraja</th><th class="num">Hozir</th><th class="num">Yangi</th><th class="num">Farq</th></tr></thead><tbody>
    ${p.ladder.map((l, i) => `<tr><td>${h(l.label)}</td><td class="num">${fmt(cur.eff[i])}</td><td class="num"><b>${fmt(nw.eff[i])}</b></td><td class="num ${nw.eff[i] > cur.eff[i] ? "up" : nw.eff[i] < cur.eff[i] ? "down" : "muted"}">${nw.eff[i] === cur.eff[i] ? "—" : signed(nw.eff[i] - cur.eff[i])}</td></tr>`).join("")}</tbody></table>`;
}
function simOut(p, pct, rt = p.round) {
  const cur = priceCalc(p), nw = priceCalc(p, pct, rt), n = doneJobs(p);
  const revC = n * cur.price, revN = n * nw.price, cost = n * cur.full;
  return `<div class="tw">${ladderCompare(p, pct, rt)}</div>
    <div class="wallets">
      <div class="wallet"><span class="eyebrow">Tushum · 30 kun</span><div class="v num">${fmt(revN)}</div><div class="muted num" style="font-size:12px">hozir ${fmt(revC)}</div></div>
      <div class="wallet"><span class="eyebrow">Xarajat · 30 kun</span><div class="v num">${fmt(Math.round(cost))}</div><div class="muted num" style="font-size:12px">o'zgarmaydi</div></div>
      <div class="wallet"><span class="eyebrow">Marja</span><div class="v num"><span class="pill ${marginTone(nw.margin)}" style="font-size:15px">${nw.margin.toFixed(1)}%</span></div><div class="muted num" style="font-size:12px">hozir ${cur.margin.toFixed(1)}%</div></div>
    </div>`;
}

      ${res.map((r) => `<tr><td>${h(r.name)}</td><td class="num">${r.score}/${r.total}</td><td>${can("moderation.act") ? `<button class="btn sm danger" data-act="delres" data-name="${h(r.name)}">O'chirish</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="3" class="muted">Natija yo\'q</td></tr>'}
      </tbody></table></div></div></div></aside>`;

}

/* ───────── events (delegated) ───────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, tr.click, input[type=checkbox]");
  if (!t || !document.getElementById("root").contains(t) && !t.closest(".drawer")) return;
  const d = t.dataset;
  if (d.menu !== undefined) { S.sideOpen = !S.sideOpen; render(); return; }
  if (d.go) return go(d.go);
  if (d.range) { S.range = d.range; return render(); }
  if (d.uf) { S.userFilter = d.uf; return render(); }
  if (d.clear !== undefined) { S.userQ = ""; S.userFilter = "all"; return render(); }
  if (d.gs) { S.genStatus = d.gs; return render(); }
  if (d.os) { S.orderState = d.os; return render(); }
  if (d.tab) { S.tab = d.tab; return render(); }
  if (d.user) return go("user", Number(d.user));
  if (d.gen) return go("generation", d.gen);
  if (d.order) return go("order", d.order);
  if (d.link) { S.drawer = { type: "link", id: d.link }; return render(); }
  if (d.price) { const p = PRICING_BY[d.price]; if (!p) return; S.drawer = { type: "pricing", id: p.id, sim: p.pct }; return render(); }
  if (d.pact) { const p = S.drawer && S.drawer.type === "pricing" && PRICING_BY[S.drawer.id]; if (!p || !can("pricing.edit")) return; return withStepUp("pricing.edit", () => (d.pact === "reset" ? priceResetDialog(p) : priceEditDialog(p))); }
  if (d.audit) { S.drawer = { type: "audit", id: Number(d.audit) }; return render(); }
  if (d.close !== undefined) { S.drawer = null; return render(); }
  if (d.esel) { const id = Number(d.esel); S.errSel.has(id) ? S.errSel.delete(id) : S.errSel.add(id); return render(); }
  if (d.export) return withStepUp(d.export, () => { writeAudit("export." + d.what, "CSV", "", null, { rows: "≤100 000", filters: "joriy" }); toast(`CSV eksport tayyorlanmoqda: ${d.what}. Amal audit jurnaliga yozildi.`); });
  if (d.set) return editSetting(d.set);
  if (d.reset) { const s = settings.find((x) => x.key === d.reset); const before = s.value; s.value = Array.isArray(s.env) ? [...s.env] : s.env; s.source = s.key.startsWith("free_llm") || s.key.startsWith("finance") ? "env" : "default"; writeAudit("settings.reset", s.key, "Standartga qaytarildi", { value: before }, { value: s.value }); toast("Standart qiymat tiklandi"); return render(); }
  if (d.bcsend) return sendBroadcast(Number(d.bcsend));
  if (d.adm) return manageAdmin(Number(d.adm));
  if (d.job) return jobAction(d.job);
  if (d.act) return act(d.act, t);
});

});
document.addEventListener("change", (e) => { if (e.target.id === "role") { S.role = e.target.value; S.drawer = null; render(); toast(`Endi siz «${ROLES[S.role].label}» rolidasiz — menyu va tugmalar shunga moslashdi`); } });

document.addEventListener("input", (e) => {

});

/* ───────── actions ───────── */
function act(a, t) {
  const u = users.find((x) => x.id === S.id);
  if (a === "reveal") { S.revealed.add(u.id); writeAudit("users.pii.view", "user " + u.id, "", null, { field: "phone" }); toast("Telefon ko'rsatildi — audit jurnaliga yozildi"); return render(); }
  if (a === "reveal-input") { S.revealed.add(S.id); writeAudit("jobs.input.view", "generation " + short(S.id), "", null, { field: "values_json" }); toast("Kiritilgan ma'lumot ko'rsatildi — audit jurnaliga yozildi"); return render(); }
  if (a === "logout") { S.authed = false; return render(); }
  if (a === "wallet") return withStepUp("users.wallet", () => walletDialog(u));
  if (a === "block") return blockDialog(u);
  if (a === "sessions") return modal({ title: "Sessiyalarni bekor qilish", sub: `${h(u.name)} barcha qurilmalardan chiqariladi (2 ta faol sessiya).`, body: reasonField(), confirm: "Bekor qilish", danger: true, validate: reasonOk,
    onConfirm: (m) => { writeAudit("users.sessions.revoke", "user " + u.id, m.querySelector("#m-reason").value, { active: 2 }, { active: 0 }); toast("2 ta sessiya bekor qilindi"); } });
  if (a === "message") return modal({ title: "Telegram orqali xabar", sub: `${h(u.name)} ga bot nomidan yuboriladi. HTML belgilar xavfsiz holatga keltiriladi.`, body: `<label class="field"><span>Xabar</span><textarea class="input" id="m-msg" rows="4" maxlength="2000"></textarea></label>`, confirm: "Yuborish",
    validate: (m) => (m.querySelector("#m-msg").value.trim() ? null : "Xabar matnini yozing"), onConfirm: () => { writeAudit("users.message", "user " + u.id, ""); toast("Xabar yuborildi"); } });
  if (a === "extrefund") return withStepUp("payments.refund_record", () => extRefundDialog(orders.find((o) => o.id === S.id)));
  if (a === "revoke") { const l = links.find((x) => x.id === t.dataset.id); return modal({ title: "Havolani o'chirish", sub: `«${h(l.topic)}» — ommaviy havola darhol ishlamay qoladi. Natijalar saqlanadi.`, body: reasonField(), confirm: "O'chirish", danger: true, validate: reasonOk,
    onConfirm: (m) => { l.active = false; writeAudit("moderation.revoke_link", "game_session " + short(l.id), m.querySelector("#m-reason").value, { active: true }, { active: false }); toast("Havola o'chirildi"); render(); } }); }
  if (a === "delres") return modal({ title: "Natijani o'chirish", sub: `«${h(t.dataset.name)}» ismli natija butunlay o'chiriladi.`, body: reasonField(), confirm: "O'chirish", danger: true, validate: reasonOk,
    onConfirm: (m) => { writeAudit("moderation.delete_result", "game_result", m.querySelector("#m-reason").value, { player_name: t.dataset.name }, null); toast("Natija o'chirildi"); } });
  if (a === "resolve") { const n = S.errSel.size; errors.forEach((e) => S.errSel.has(e.id) && (e.resolved = true)); S.errSel.clear(); writeAudit("errors.resolve", n + " ta xato", ""); toast(`${n} ta xato hal qilindi deb belgilandi`); return render(); }
  if (a === "newbc") return withStepUp("broadcasts.send", newBroadcast);
  if (a === "newadmin") return withStepUp("admins.manage", newAdmin);
}

function walletDialog(u) {
  const thr = settings.find((s) => s.key === "admin.wallet_confirm_threshold").value;
  modal({
    title: "Hamyonni tuzatish", sub: `${h(u.name)} · #${u.id}. Foydalanuvchi tarixida «Ma'muriy tuzatish» deb ko'rinadi; sabab va ismingiz faqat audit jurnalida.`,
    body: `<div class="grid g2" style="gap:10px"><label class="field"><span>Hamyon</span><select class="input" id="m-w"><option value="balance">Balans (${fmt(u.balance)})</option><option value="points">Ball (${fmt(u.points)})</option><option value="quota">Kvota (${fmt(u.quota)})</option></select></label>
      <label class="field"><span>Amal</span><select class="input" id="m-sign"><option value="1">+ Qo'shish</option><option value="-1">− Yechish</option></select></label></div>
      <label class="field"><span>Miqdor (tanga)</span><input class="input num" id="m-amt" inputmode="numeric" placeholder="masalan 6000"></label>
      <div class="ba" id="m-ba">Oldin <b class="num" id="m-b">${fmt(u.balance)}</b> → keyin <b class="num" id="m-a">${fmt(u.balance)}</b></div>
      <label class="field"><span>Sabab turi</span><select class="input" id="m-code"><option value="compensation">Kompensatsiya</option><option value="promo">Aksiya / bonus</option><option value="correction">Xatoni tuzatish</option><option value="manual_refund">Qo'lda qaytarish</option><option value="test">Sinov</option><option value="other">Boshqa</option></select></label>
      ${reasonField("Izoh")}
      <label class="field" id="m-conf-wrap" hidden><span>Katta summa: tasdiqlash uchun miqdorni qayta yozing</span><input class="input num" id="m-conf"></label>`,
    confirm: "Qo'llash",
    validate: (m) => {
      const amt = Number(m.querySelector("#m-amt").value.replace(/\D/g, "")); const w = m.querySelector("#m-w").value; const sign = Number(m.querySelector("#m-sign").value);
      if (!amt) return "Musbat butun son kiriting";
      if (sign < 0 && amt > u[w]) return `Yetarli emas. Mavjud: ${fmt(u[w])}`;
      if (amt >= thr && m.querySelector("#m-conf").value.replace(/\D/g, "") !== String(amt)) return "Miqdorni tasdiqlash maydoniga aynan qayta yozing";
      return reasonOk(m);
    },
    onConfirm: (m) => {
      const amt = Number(m.querySelector("#m-amt").value.replace(/\D/g, "")); const w = m.querySelector("#m-w").value; const sign = Number(m.querySelector("#m-sign").value);
      const before = u[w]; u[w] += sign * amt;
      writeAudit("users.wallet.adjust", "user " + u.id, m.querySelector("#m-code").value + ": " + m.querySelector("#m-reason").value, { [w]: before }, { [w]: u[w] });
      toast(`${w}: ${fmt(before)} → ${fmt(u[w])}. Idempotency-Key bilan bir marta yozildi.`); render();
    },
  });
  const upd = () => {
    const w = modalEl.querySelector("#m-w").value, amt = Number(modalEl.querySelector("#m-amt").value.replace(/\D/g, "")) || 0, sign = Number(modalEl.querySelector("#m-sign").value);
    modalEl.querySelector("#m-b").textContent = fmt(u[w]); modalEl.querySelector("#m-a").textContent = fmt(u[w] + sign * amt);
    modalEl.querySelector("#m-conf-wrap").hidden = amt < thr;
  };
  ["#m-w", "#m-amt", "#m-sign"].forEach((s) => modalEl.querySelector(s).addEventListener("input", upd));
}

    modal({ title: "Sozlamani o'zgartirish", sub: `<span class="mono">${s.key}</span> · hozir ${s.source === "env" ? "env qiymati" : s.source === "db" ? "admin qiymati" : "standart"}.`, body: input + reasonField(), confirm: "Saqlash",

        writeAudit("settings.update", s.key, m.querySelector("#m-reason").value, { value: before }, { value: s.value }); toast("Saqlandi. Barcha jarayonlarga 15 soniyada yetadi."); render(); } });
