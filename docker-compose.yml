services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: slaydx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slaydx}
      POSTGRES_DB: slaydx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaydx"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Port faqat ichki tarmoqda — tashqariga chiqarmaymiz.
    expose:
      - "5432"

  web:
    build:
      context: .
      # `target` MAJBURIY: Dockerfile dagi oxirgi bosqich `worker`, ya'ni
      # target ko'rsatilmasa `web` servisi ham worker'ni ishga tushiradi
      # va hech narsa portni tinglamaydi. Bu aynan shunday sodir bo'ldi —
      # Docker yo'li lokal `npm run dev` bilan sinalgani uchun bu nuqson
      # birinchi haqiqiy deploygacha ko'rinmadi.
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://slaydx:${POSTGRES_PASSWORD:-slaydx}@postgres:5432/slaydx
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET kerak — openssl rand -base64 48}
      NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-SlaydX}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NEXT_PUBLIC_TELEGRAM_BOT: ${NEXT_PUBLIC_TELEGRAM_BOT:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      FAL_KEY: ${FAL_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux/schnell}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      NEXT_PUBLIC_BRAND_LOGO: ${NEXT_PUBLIC_BRAND_LOGO:-/logo.png}
      CLICK_MERCHANT_USER_ID: ${CLICK_MERCHANT_USER_ID:-}
      PAYME_TEST_KEY: ${PAYME_TEST_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      FILE_TTL_HOURS: ${FILE_TTL_HOURS:-72}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      # Reverse proxy ortida turibmiz — `x-forwarded-for` ga ishonamiz,
      # aks holda IP chegarasi hamma so'rovni bitta IP deb hisoblardi.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Web faqat so'rovlarga javob beradi; navbatni alohida worker bajaradi.
      WORKER_INLINE: "false"
    ports:
      # FAQAT localhost. Umumiy serverda 0.0.0.0 ga bog'lash ilovani
      # to'g'ridan-to'g'ri internetga ochib qo'yardi — nginx uni proxy
      # qiladi va TLS ni o'zi tugatadi.
      - "127.0.0.1:${PORT:-3000}:3000"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://slaydx:${POSTGRES_PASSWORD:-slaydx}@postgres:5432/slaydx
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET kerak}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      FAL_KEY: ${FAL_KEY:-}
      FAL_MODEL: ${FAL_MODEL:-fal-ai/flux/schnell}
      FAL_MODEL_PREMIUM: ${FAL_MODEL_PREMIUM:-}
      GEMINI_THINKING_BUDGET: ${GEMINI_THINKING_BUDGET:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-300000}

volumes:
  pgdata:
