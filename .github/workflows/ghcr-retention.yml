# GHCR retention for ghcr.io/khusinboev/slaydx-{web,worker} (ops sprint P-CI; O1 §3.5).
#
# Storage is free today, but if GitHub ever bills container storage from the Packages quota (500 MB on Free) the
# images would exceed it quickly — this keeps the registry bounded. A package VERSION is one digest; after `promote`
# the same version carries `build-<sha>`, `<sha>` and possibly `main`.
#
# GitHub cannot know which sha production runs (deploys are manual), so the policy keeps every plausible deployed or
# rollback version generously. Per package, a version is KEPT when any of these holds — everything else is deleted:
#   1. it carries the `main` tag, or a `keep-*` tag (manual pin, e.g. `keep-prod`; never deleted);
#   2. it is among the newest KEEP_PROMOTED (>= 10) versions carrying a promoted `<sha>` tag (40 hex), REGARDLESS of
#      age — an owner who stays on one deploy while CI keeps pushing `main` still has it and older rollback targets;
#   3. its digest equals the digest of a version kept by 1 or 2;
#   4. it is among the newest KEEP_BUILDS versions carrying a `build-*` tag (incl. the in-flight CI candidate);
#   5. it carries a promoted `<sha>` tag and is at most PROMOTED_MAX_AGE_DAYS (90) old;
#   6. it is untagged and at most UNTAGGED_MAX_AGE_DAYS (30) old (a re-run that moved a tag).
# So a deployable `<sha>` is deleted only when it is > 90 days old AND at least KEEP_PROMOTED newer promoted versions
# exist AND it is not among the newest KEEP_BUILDS builds. To pin a deploy forever:
#   docker buildx imagetools create -t ghcr.io/khusinboev/slaydx-web:keep-prod ghcr.io/khusinboev/slaydx-web:<sha>
# (same for slaydx-worker). Images on the server are unaffected by registry deletion; only re-pulling needs the version.
#
# Dry run by default: scheduled runs only REPORT until the owner sets the repository variable
# GHCR_RETENTION_APPLY=true (Settings → Secrets and variables → Actions → Variables); a manual run deletes only with
# `apply: true`. Token: the automatic GITHUB_TOKEN (packages: write). The packages are created by this repo's CI, so the
# repo has admin access to them, which version deletion requires. No other secret.
name: GHCR retention

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      apply:
        description: "Really delete (unchecked = dry run: only list what would be deleted)"
        type: boolean
        default: false
      keep_builds:
        description: "How many newest build-* versions to keep per package"
        type: number
        default: 20

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

permissions: {}

jobs:
  prune:
    name: prune ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [slaydx-web, slaydx-worker]
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ matrix.package }}
      APPLY: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'schedule' && vars.GHCR_RETENTION_APPLY == 'true') }}
      # format(): a dispatched 0 stays "0" (and is rejected below) instead of silently becoming the default.
      KEEP_BUILDS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.keep_builds) || '20' }}
      KEEP_PROMOTED: "10"
      PROMOTED_MAX_AGE_DAYS: "90"
      UNTAGGED_MAX_AGE_DAYS: "30"
      # Input: array of package versions (GitHub REST). Args: $now (epoch s), $keepBuilds, $keepPromoted (int),
      # $promotedMaxAge, $untaggedMaxAge (days). Output: [{id, name, created_at, tags, keep}], keep = reason or null = delete.
      RETENTION_JQ: |
        def tags: (.metadata.container.tags // []);
        def promoted: any(tags[]; test("^[0-9a-f]{40}$"));
        def pinned: any(tags[]; . == "main" or startswith("keep-"));
        def age_days: ($now - (.created_at | sub("\\.[0-9]+"; "") | fromdateiso8601)) / 86400;
        def newest($n): sort_by(.created_at) | reverse | .[:$n] | map(.id);
        (map(select(any(tags[]; startswith("build-")))) | newest($keepBuilds)) as $recentBuilds
        | (map(select(promoted)) | newest($keepPromoted)) as $recentPromoted
        | ([.[] | select(pinned or (.id as $id | any($recentPromoted[]; . == $id))) | .name]) as $protectedDigests
        | map(
            . as $v
            | (if any(tags[]; . == "main") then "main tag"
               elif any(tags[]; startswith("keep-")) then "keep-* tag"
               elif any($recentPromoted[]; . == $v.id) then "newest \($keepPromoted) promoted"
               elif any($protectedDigests[]; . == $v.name) then "same digest as a protected version"
               elif any($recentBuilds[]; . == $v.id) then "newest \($keepBuilds) build-*"
               elif promoted and age_days <= $promotedMaxAge then "promoted sha, <= \($promotedMaxAge) days"
               elif (tags | length) == 0 and age_days <= $untaggedMaxAge then "untagged, <= \($untaggedMaxAge) days"
               else null end) as $reason
            | {id, name, created_at, tags: tags, keep: $reason}
          )
    steps:
      - name: Plan and apply retention
        run: |
          set -euo pipefail
          [[ "$KEEP_BUILDS" =~ ^[0-9]+$ ]] && [ "$KEEP_BUILDS" -ge 1 ] || { echo "::error::keep_builds must be >= 1"; exit 1; }
          [[ "$KEEP_PROMOTED" =~ ^[0-9]+$ ]] && [ "$KEEP_PROMOTED" -ge 10 ] || { echo "::error::KEEP_PROMOTED must be >= 10"; exit 1; }
          base="users/$OWNER/packages/container/$PACKAGE"
          if ! gh api "$base" --silent 2>"$RUNNER_TEMP/err"; then
            if grep -q "404" "$RUNNER_TEMP/err"; then
              echo "::notice::$PACKAGE does not exist yet (no main push since CI images were added); nothing to do"
              exit 0
            fi
            cat "$RUNNER_TEMP/err"; exit 1
          fi
          gh api --paginate "$base/versions?per_page=100" | jq -s 'add // []' >"$RUNNER_TEMP/versions.json"
          jq --argjson now "$(date +%s)" --argjson keepBuilds "$KEEP_BUILDS" --argjson keepPromoted "$KEEP_PROMOTED" \
            --argjson promotedMaxAge "$PROMOTED_MAX_AGE_DAYS" --argjson untaggedMaxAge "$UNTAGGED_MAX_AGE_DAYS" \
            "$RETENTION_JQ" "$RUNNER_TEMP/versions.json" >"$RUNNER_TEMP/plan.json"

          total=$(jq 'length' "$RUNNER_TEMP/plan.json")
          kept=$(jq '[.[] | select(.keep != null)] | length' "$RUNNER_TEMP/plan.json")
          delete_ids=$(jq -r '.[] | select(.keep == null) | .id' "$RUNNER_TEMP/plan.json")
          {
            echo "### $PACKAGE: $total versions, keep $kept, delete $((total - kept)) (apply: $APPLY)"
            echo
            echo "| version | created | tags | decision |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.id) | \(.created_at) | \(.tags | join(", ")) | \(.keep // "**delete**") |"' "$RUNNER_TEMP/plan.json"
          } >>"$GITHUB_STEP_SUMMARY"

          # Belt and braces: never empty a package, and never delete anything when no version carries `main`
          # while promoted versions exist (would indicate a broken promote; investigate first).
          if [ "$total" -gt 0 ] && [ "$kept" -eq 0 ]; then
            echo "::error::plan would delete every version of $PACKAGE; refusing"; exit 1
          fi
          if jq -e 'any(.[]; any(.tags[]; test("^[0-9a-f]{40}$"))) and (any(.[]; any(.tags[]; . == "main")) | not)' \
              "$RUNNER_TEMP/plan.json" >/dev/null; then
            echo "::error::$PACKAGE has promoted versions but no main tag; refusing to delete"; exit 1
          fi

          if [ -z "$delete_ids" ]; then echo "nothing to delete"; exit 0; fi
          if [ "$APPLY" != "true" ]; then
            echo "dry run — would delete version ids: $(echo "$delete_ids" | tr '\n' ' ')"
            exit 0
          fi
          while read -r id; do
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::unexpected version id '$id'"; exit 1; }
            gh api -X DELETE "$base/versions/$id" --silent
            echo "deleted version $id"
          done <<<"$delete_ids"
